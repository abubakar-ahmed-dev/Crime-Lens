# Prometheus scrape configuration (Phase 8).
#
# Local run (from repo root):
#   docker run -d --name crimelens-prom -p 9090:9090 \
#     -v "$(pwd)/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
#     prom/prometheus
#
# When Prometheus itself runs in Docker but the API runs on the host, the
# `localhost:5001` target must be replaced by `host.docker.internal:5001`
# (Docker Desktop). The extra target below covers both cases; one will be
# DOWN — that is expected and harmless.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "crimelens-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "localhost:5001"           # Prometheus on the host
          - "host.docker.internal:5001" # Prometheus in Docker (Windows/Mac)
