# CrimeLens edge reverse proxy + load balancer (Phase 10).
# Mounted at /etc/nginx/nginx.conf inside the edge nginx container.
#
# Topology:  client → edge :80 ─┬─ /        → frontend:80   (SPA static)
#                               └─ /api/    → backend pool   (replicas via
#                                             Docker DNS + passive checks)
#
# Deliberately NOT here:
#   - /metrics (Prometheus scrapes backend:5001 on the internal network)
#   - TLS (Cloudflare terminates it in Phase 13)
#   - nginx rate limiting (the backend's Redis limiter owns abuse control)
#   - CSP/HSTS (owned by frontend nginx + backend helmet, Phase 5)

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream timing fields feed the Phase 11 scaling and Phase 15 k6
    # comparisons. Logs go to stdout/stderr (docker logs).
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'b=$body_bytes_sent rt=$request_time '
                    'uct=$upstream_connect_time urt=$upstream_response_time '
                    'up=$upstream_addr';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 2048;

    # Backend pool. `backend` is the compose service DNS name: Docker's
    # embedded DNS returns one A record per running replica, which gives
    # round-robin across instances (Phase 11 scales them). Passive health
    # checks eject a replica after 3 failures within 30s and retry after.
    upstream crimelens_backend {
        least_conn;
        server backend:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Media uploads: 10 files x 5 MB per report — nginx's 1 MB default
    # would 413 legitimate multi-image submissions.
    client_max_body_size 50m;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Never route metrics through the public edge — Prometheus scrapes
        # backend:5001 on the internal network. Without this, the SPA
        # fallback would answer /metrics with index.html (harmless but
        # misleading).
        location = /metrics {
            return 404;
        }

        # SPA static container (phase 9 image: nginx + built dist)
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API pool. X-Forwarded-For + TRUST_PROXY=1 let the backend resolve
        # the real client IP so per-IP rate limiting stays per-client.
        location /api/ {
            proxy_pass http://crimelens_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
