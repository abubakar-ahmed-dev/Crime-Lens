# CrimeLens SPA + API proxy (Phase 9).
# Mounted into the frontend image at /etc/nginx/conf.d/default.conf.
#
# NOTE: /metrics is intentionally NOT proxied — Prometheus metrics must stay
# off the public entrypoint (network-level allow-listing lands in Phase 10).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads: up to 10 files x 5 MB per crime report. nginx defaults to
    # 1 MB and would 413 every real upload — this must stay explicit.
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (mirrors the backend's helmet posture for static assets)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy — backend:5001 is the compose-network DNS name. The URI is
    # passed through unchanged (backend routes are mounted under /api).
    # X-Forwarded-* lets the backend resolve real client IPs (TRUST_PROXY=1).
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets are content-addressed — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
